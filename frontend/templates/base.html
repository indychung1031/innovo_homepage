<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Innovo Solution{% endblock %}</title>
  {% block hreflang %}
  <link rel="alternate" hreflang="en" href="https://www.innovosolution.co.kr/en{{ path_without_lang }}">
  <link rel="alternate" hreflang="ko" href="https://www.innovosolution.co.kr/ko{{ path_without_lang }}">
  <link rel="alternate" hreflang="x-default" href="https://www.innovosolution.co.kr/en{{ path_without_lang }}">
  {% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/site.css">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-white">
  {% include "partials/site_header.html" %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/site_footer.html" %}
  {% include "partials/cookie_banner.html" %}
  <script src="/static/js/cookie-consent.js"></script>
  <script src="/static/js/nav.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
